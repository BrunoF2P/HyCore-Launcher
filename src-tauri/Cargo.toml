[package]
name = "hycore"
version = "0.2.0"
description = "A Tauri App"
authors = ["BrunoF2P"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hycore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.1", features = ["json", "stream"] }
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
dirs = "6.0.0"
sysinfo = "0.37.2"
zip = "7.2.0"
flate2 = "1.0"
tar = "0.4"
tauri-plugin-updater = "2.9.0"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
mimalloc = "0.1.43"
discord-rich-presence = "1.0.0"
once_cell = "1.21.3"
thiserror = "2.0.18"
anyhow = "1.0.100"
time = { version = "0.3.45", features = ["serde-human-readable", "formatting", "parsing", "local-offset", "macros"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
uuid = { version = "1", features = ["v3", "v4"] }
base64 = "0.22"

[profile.release]
opt-level = "z"     # Optimize for size. Use 3 for maximum speed.
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel code generation units for better optimization
panic = "abort"     # Remove stack unwinding code to save space
strip = true        # Automatically strip symbols from the binary

